name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and release
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build arm64
        run: cargo build --release

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/release/clickbait-audio \
            target/x86_64-apple-darwin/release/clickbait-audio \
            -output clickbait-audio
          chmod +x clickbait-audio
          tar czf clickbait-audio-macos-universal.tar.gz clickbait-audio

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: clickbait-audio-macos-universal.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: clickbait-audio-macos-universal.tar.gz
          generate_release_notes: true
