name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and release
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package binary
        run: |
          chmod +x target/release/clickbait-audio
          tar czf clickbait-audio-macos-arm64.tar.gz -C target/release clickbait-audio

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: clickbait-audio-macos-arm64.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: clickbait-audio-macos-arm64.tar.gz
          generate_release_notes: true
