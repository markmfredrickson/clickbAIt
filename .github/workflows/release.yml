name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and release
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render SKILL.md
        run: |
          npm install
          npm run build:skill

      - name: Package skill bundle
        run: |
          chmod +x target/release/clickbait-audio
          mkdir -p skill/bin
          cp target/release/clickbait-audio skill/bin/clickbait-audio
          cp .claude/skills/clickbait/SKILL.md skill/SKILL.md
          tar czf clickbait-skill-macos-arm64.tar.gz skill/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: clickbait-skill-macos-arm64.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: clickbait-skill-macos-arm64.tar.gz
          generate_release_notes: true
