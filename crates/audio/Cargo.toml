[package]
name = "clickbait-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Audio analysis, transcription, and TTS for clickbAIt"

[[bin]]
name = "clickbait-audio"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Audio analysis (BPM, key, beats)
symphonia = { version = "0.5", features = ["mp3", "wav", "pcm"] }
rustfft = "6.2"

# Speech-to-text (lyrics from audio)
whisper-rs = "0.16"

# Text-to-speech (spoken cues)
piper-rs = { git = "https://github.com/thewh1teagle/piper-rs", rev = "6715e32" }
hound = "3"

# Song lookup (HTTP APIs)
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
scraper = "0.22"
dotenvy = "0.15"

# Stem separation (demucs)
demucs-core = { git = "https://github.com/nikhilunni/demucs-rs", rev = "97adfaa" }
burn = { version = "0.20.1" }
pollster = "0.4"

[features]
default = ["gpu"]
gpu = ["demucs-core/wgpu", "burn/wgpu"]
cpu = ["demucs-core/ndarray", "burn/ndarray"]

[dev-dependencies]
tempfile = "3"
