[package]
name = "clickbait-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Audio analysis, transcription, and TTS for clickbAIt"

[[bin]]
name = "clickbait-audio"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Audio analysis (BPM, key, beats)
# essentia = "0.1"  # TODO: uncomment when ready

# Speech-to-text (lyrics from audio)
# whisper-rs = "0.13" # TODO: uncomment when ready

# Text-to-speech (spoken cues)
piper-rs = { git = "https://github.com/thewh1teagle/piper-rs", rev = "6715e32" }
hound = "3"

# Song lookup (HTTP APIs)
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
scraper = "0.22"
dotenvy = "0.15"
