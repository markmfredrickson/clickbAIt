<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Control — clickbAIt</title>
  <style>
    /* A stage control is never a white screen, so this page commits to dark. */
    :root {
      --ground: #0b0d0f; --panel: #15191d; --panel-2: #1d232a; --line: #2a313a;
      --text: #e8edf2; --dim: #78838e;
      --live: #3be08a; --out: #ff9e2c; --out-deep: #a35c00; --vamp: #a678ff; --stop: #ff4d5e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--ground); color: var(--text);
      font-family: -apple-system, system-ui, sans-serif;
      display: flex; flex-direction: column;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    body.m-out { animation: pulse 1.1s steps(1) infinite; }
    @keyframes pulse {
      0%, 49%   { background: #1a1206; }
      50%, 100% { background: var(--ground); }
    }
    @media (prefers-reduced-motion: reduce) { body.m-out { animation: none; background: #1a1206; } }

    /* One line: this song, next song, set list, connection dot.
       This song is the bigger of the two. */
    header { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
    #song, #s-next small {
      font-size: 17px; font-weight: 600; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #song { order: 1; flex: 1.4 1 0; min-width: 0; padding: 10px 12px; align-self: center; font-size: 22px; }
    #song small { display: block; font-weight: 400; font-size: 11px; color: var(--dim); margin-top: 2px; }
    /* The connection is a dot; its text stays for screen readers. */
    #conn { order: 4; flex: none; width: 22px; font-size: 0; display: flex; align-items: center; justify-content: center; }
    #conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
    #conn.ok::before { background: var(--live); }
    #conn.bad::before { background: var(--stop); }

    /* Set list: next song is the one-tap path, the list is for jumping. */
    #set { display: contents; }
    #set[hidden] { display: none !important; }
    #set button, #tport button {
      border: 0; background: var(--panel); color: var(--text); font: inherit; cursor: pointer;
      padding: 12px 8px; border-right: 1px solid var(--line);
    }
    #set button:last-child, #tport button:last-child { border-right: 0; }
    #set button:disabled { color: #3b444d; cursor: default; }
    #s-next {
      order: 2; flex: 1 1 0; min-width: 0; text-align: left; padding-left: 12px; border-left: 1px solid var(--line);
      display: flex; flex-direction: column-reverse; justify-content: center;
      font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--live);
    }
    #s-next small { display: block; letter-spacing: 0; text-transform: none; color: var(--text); margin-bottom: 2px; }
    #s-next:disabled, #s-next:disabled small { color: #3b444d; }
    #s-list { order: 3; flex: none; width: 52px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
    /* Filled buttons. Play, bail and stop live on the big bottom bar; video
       and full screen are set-up choices, kept behind More. */
    #tport, #more { display: grid; gap: 6px; padding: 6px; border-bottom: 1px solid var(--line); }
    #tport { grid-template-columns: 1fr 1fr; }
    #t-vamp:disabled { opacity: .35; cursor: default; }
    #more { grid-template-columns: 1fr 1fr 1fr; }
    #more[hidden] { display: none !important; }
    #tport button, #more button {
      border: 0; border-radius: 6px; background: var(--text); color: var(--ground); font: inherit; cursor: pointer;
      font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 18px 4px;
    }
    #m-stems.on { background: var(--live); }

    /* Tracks: a checklist, checked = playing. Whole rows are the targets, tall
       enough to hit mid-song. Single stems sit indented under Stems and show
       only when "Stem mutes" is on under More. */
    #mutes { border-bottom: 1px solid var(--line); }
    #mutes:empty { display: none; }
    .trk {
      display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px;
      padding: 0 14px; border: 0; border-bottom: 1px solid #1f252c; background: var(--panel);
      color: var(--text); font: inherit; font-size: 18px; font-weight: 600; text-align: left; cursor: pointer;
    }
    .trk:last-child { border-bottom: 0; }
    .trk.child { padding-left: 46px; font-size: 16px; }
    .trk .box {
      flex: none; width: 28px; height: 28px; border-radius: 6px; border: 2px solid var(--text);
      display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1;
    }
    .trk.on .box { background: var(--live); border-color: var(--live); color: var(--ground); }
    .trk:not(.on) { color: var(--dim); }
    .trk:not(.on) .box { border-color: var(--dim); }
    #t-more.on { background: var(--dim); }
    #notice { padding: 9px 14px; font-size: 12px; border-bottom: 1px solid var(--line); background: rgba(255,77,94,.15); color: var(--stop); }
    #notice[hidden] { display: none !important; }
    #setlist { position: absolute; inset: 0; background: var(--panel); display: none; overflow-y: auto; z-index: 5; }
    #setlist.on { display: block; }
    .set-row { padding: 14px; border-bottom: 1px solid #1f252c; font-size: 17px; font-weight: 600; color: #8b96a1; cursor: pointer; }
    .set-row span { display: inline-block; width: 2em; color: #4d5760; font-variant-numeric: tabular-nums; }
    .set-row.here { color: var(--live); }

    /* Song map — the arrangement as a strip. */
    #map { display: flex; gap: 2px; padding: 9px 14px; border-bottom: 1px solid var(--line); }
    .seg { height: 14px; border-radius: 2px; background: #2b333c; transition: background .12s linear; }
    /* The current section fills as it plays (--p, 0 to 1); played ones stay tinted. */
    .seg.now { background: linear-gradient(to right, var(--live) calc(var(--p, 0) * 100%), rgba(59,224,138,.25) 0); }
    .seg.past { background: rgba(59,224,138,.35); }
    /* A loop shows its pass like the song does, in purple: played sections
       solid, the playing one filling, the rest faint. */
    .seg.loop { background: rgba(166,120,255,.3); }
    .seg.loop.lp-past { background: var(--vamp); }
    .seg.loop.lp-now { background: linear-gradient(to right, var(--vamp) calc(var(--p, 0) * 100%), rgba(166,120,255,.3) 0); }
    .m-out .seg.now { background: linear-gradient(to right, var(--out) calc(var(--p, 0) * 100%), rgba(255,158,44,.25) 0); }

    #banner { padding: 13px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
    #banner-label {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--dim); margin-bottom: 3px;
    }
    #banner-name { font-size: 30px; font-weight: 700; line-height: 1; }
    .m-out #banner { background: rgba(255,158,44,.1); }
    .m-out #banner-label, .m-out #banner-name { color: var(--out); }
    .m-vamp #banner, .m-leaving #banner { background: rgba(166,120,255,.12); }
    .m-vamp #banner-label, .m-vamp #banner-name,
    .m-leaving #banner-label, .m-leaving #banner-name { color: var(--vamp); }

    #warn {
      padding: 9px 14px; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase;
      border-bottom: 1px solid var(--line); background: rgba(255,158,44,.15); color: var(--out);
    }
    #warn[hidden] { display: none !important; }
    #warn.vamp { background: rgba(166,120,255,.15); color: var(--vamp); }

    main { flex: 1; position: relative; overflow: hidden; }

    /* Section list, doubling as the vamp-range picker. */
    #rows { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #rows .row { cursor: pointer; }
    .row {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
      padding: 11px 14px; border-bottom: 1px solid #1f252c;
    }
    .row-name { font-size: 17px; font-weight: 600; color: #5d6871; line-height: 1.2; }
    .row-beat { font-size: 10px; color: #444d56; font-variant-numeric: tabular-nums; }
    .row.here .row-name { color: var(--text); }
    .row.sel { background: rgba(166,120,255,.16); }
    .row.sel .row-name { color: var(--text); }
    .row.before { opacity: .35; }

    /* Rare-actions drawer. */
    #drawer { position: absolute; inset: 0; background: var(--panel); display: none; flex-direction: column; z-index: 4; }
    #drawer.on { display: flex; }
    #drawer-head {
      padding: 10px 14px; border-bottom: 1px solid var(--line);
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vamp);
      background: rgba(166,120,255,.08); display: flex; justify-content: space-between; gap: 10px;
    }
    #drawer-close { color: var(--dim); }
    #drawer-rows { flex: 1; overflow-y: auto; }
    .dbtn {
      border: 0; padding: 16px 12px; font: inherit; font-weight: 700; font-size: 18px;
      letter-spacing: 0.04em; text-transform: uppercase; text-align: center; cursor: pointer;
      border-top: 1px solid var(--line);
    }
    #d-vamp { background: var(--vamp); color: #120823; }
    #d-stop { background: var(--panel-2); color: var(--stop); }
    #d-stop.armed { background: var(--stop); color: #1a0206; }

    /* The one control. Full width so it needs no aiming — a knuckle will do. */
    #bar {
      border: 0; border-top: 1px solid var(--line); width: 100%;
      padding: 22px 14px calc(24px + env(safe-area-inset-bottom, 0px));
      background: var(--panel-2); color: var(--text); font: inherit;
      font-size: 26px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
      line-height: 1; text-align: center; cursor: pointer; position: relative;
      touch-action: none;
    }
    #bar:focus-visible { outline: 2px solid var(--live); outline-offset: -4px; }
    #bar-sub {
      display: block; font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
      text-transform: none; color: var(--dim); margin-top: 8px;
    }
    .grip {
      position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
      width: 34px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.18);
    }
    .m-out #bar { background: var(--out); color: #140c00; }
    .m-out #bar-sub { color: #4a3000; }
    .m-vamp #bar, .m-leaving #bar { background: var(--vamp); color: #120823; }
    .m-vamp #bar-sub, .m-leaving #bar-sub { color: #3b1f66; }
    .m-stopped #bar { background: var(--panel-2); color: var(--dim); }

    /* Transport stopped: there is nothing to bail out of, and a vamp entered
       here could never leave (leaving resolves at the loop end, and the beat
       never gets there). So the bar goes inert rather than offering a trap. */
    body.idle #bar { background: #12161a; color: #4d5760; cursor: default; }
    body.idle #bar-sub { color: #3b444d; }
    body.idle .grip { background: rgba(255,255,255,.06); }

    /* Stopped, the bar is a green Play. */
    body.ready #bar { background: var(--live); color: var(--ground); }
    body.ready #bar-sub { color: #0b3a22; }
    /* Press and hold to stop: a red fill sweeps across while held. */
    #bar::after {
      content: ""; position: absolute; inset: 0; background: var(--stop); opacity: .55;
      transform: scaleX(0); transform-origin: left; pointer-events: none;
    }
    #bar.holding::after { transform: scaleX(1); transition: transform 700ms linear; }
    body.idle #banner-name { color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <div id="song">Waiting for song…<small id="song-artist"></small></div>
    <nav id="set" hidden>
      <button id="s-next" type="button">Next<small id="s-next-name">—</small></button>
      <button id="s-list" type="button">Set</button>
    </nav>
    <div id="conn">Connecting…</div>
  </header>
  <div id="tport">
    <button type="button" id="t-vamp">Vamp</button>
    <button type="button" id="t-more">More</button>
  </div>
  <div id="more" hidden>
    <button type="button" data-player="video">Video</button>
    <button type="button" data-player="fullscreen">Full screen</button>
    <button type="button" id="m-stems">Stem mutes</button>
  </div>
  <div id="mutes"></div>
  <div id="notice" hidden></div>

  <div id="map"></div>

  <div id="banner">
    <div id="banner-label">Now playing</div>
    <div id="banner-name">—</div>
  </div>

  <div id="warn" hidden></div>

  <main>
    <div id="rows"></div>
    <div id="setlist"></div>
    <div id="drawer">
      <div id="drawer-head">
        <span id="drawer-title">Vamp from here</span>
        <span id="drawer-close">Close ✕</span>
      </div>
      <div id="drawer-rows"></div>
      <button class="dbtn" id="d-vamp" type="button">Start vamp</button>
      <button class="dbtn" id="d-stop" type="button">Stop the track</button>
    </div>
  </main>

  <button id="bar" type="button">
    <span class="grip"></span>
    <span id="bar-main">Play</span>
    <span id="bar-sub">Starts the track</span>
  </button>

  <script src="control.js"></script>
</body>
</html>
