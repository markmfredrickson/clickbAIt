<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>clickbAIt: One Simple Track</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header">
    <h1 id="song-title"></h1>
    <div id="song-meta"></div>
    <div id="controls">
      <div id="transport-light" class="stopped" title="Transport state"></div>
      <label>
        Offset
        <input type="range" id="offset-slider" min="0" max="16" step="0.5" value="0">
        <span id="offset-value">0</span> beats ahead
      </label>
      <button id="scroll-mode-btn" title="Toggle auto-scroll">Auto</button>
      <span id="bundle-controls" hidden>
        <label>
          Loop
          <select id="loop-select" title="Loop a section (click a section name too)">
            <option value="-1">Off</option>
          </select>
        </label>
        <label>
          Speed
          <input type="range" id="speed-slider" min="0.5" max="1" step="0.05" value="1" title="Slow down (pitch preserved)">
          <span id="speed-value">100%</span>
        </label>
      </span>
      <label>
        Size
        <input type="range" id="size-slider" min="0.75" max="8" step="0.25" value="1.5">
      </label>
      <button id="dark-mode-btn" title="Toggle dark/light">🌙</button>
    </div>
  </header>

  <main id="lyrics-container"></main>

  <footer id="status-bar">
    <span id="connection-status">Connecting…</span>
    <span style="opacity:0.5">AI-assisted beta</span>
    <span id="beat-display">Beat: —</span>
  </footer>

  <script src="teleprompter.js"></script>
</body>
</html>
