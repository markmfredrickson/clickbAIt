<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Split — clickbAIt</title>
  <style>
    :root { --ground: #0b0d0f; --line: #2a313a; --grip: #4d5760; --text: #e8edf2; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--ground); color: var(--text); font-family: -apple-system, system-ui, sans-serif; }
    #split { position: fixed; inset: 0; display: flex; flex-direction: column; }
    #split.across { flex-direction: row; }
    iframe { border: 0; flex: none; min-width: 0; min-height: 0; background: var(--ground); }
    .divider { flex: none; background: var(--line); touch-action: none; position: relative; }
    #split:not(.across) .divider { height: 10px; cursor: row-resize; }
    #split.across .divider { width: 10px; cursor: col-resize; }
    .divider::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--grip); border-radius: 2px; }
    #split:not(.across) .divider::after { width: 40px; height: 3px; }
    #split.across .divider::after { width: 3px; height: 40px; }
    /* While dragging, the frames mustn't swallow the pointer. */
    #split.dragging iframe { pointer-events: none; }
    #error { padding: 24px; font-size: 16px; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="split"></div>
  <script src="split.js"></script>
</body>
</html>
